name: PR Checks

on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - '**.md'

jobs:
  native-lifecycle:
    name: Native lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOFIPS140: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native CLI
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP "quartz"
          if ($IsWindows) { $binary += ".exe" }
          go build -o $binary ./cmd/quartz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QUARTZ_NATIVE_BINARY=$binary" >> $env:GITHUB_ENV
      - name: Execute native local-state lifecycle
        run: go test -v -count=1 -timeout=15m ./cmd/quartz -run TestNativeExecutableLifecycle

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: true

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .

  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26
        cache: true

    - name: Install mise
      uses: jdx/mise-action@v2

    - name: Run tests
      run: mise run test-ci

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
