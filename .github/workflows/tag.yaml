name: Tag Version

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/changelog

      - name: Run semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release succeeds without tagging when no commit warrants a
      # release, so only dispatch for a tag it created on this commit.
      - name: Resolve release tag
        id: release_tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release tag on ${GITHUB_SHA}; skipping the Release workflow."
          fi

      - name: Trigger Workflow
        uses: actions/github-script@v7
        if: steps.release_tag.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yaml',
              ref: process.env.RELEASE_TAG,
            })
